extraction:
  prompt_version: v4
  frame_step: 5 # how much to skip between frames (e.g. frame_step: 5 would extract every 5th frame)
  frame_max: 300 # upper bound on frames to extract (only relevant if using frame_step)
  # frame_indices: [0] # specific frame indices to extract (overrides frame_step and frame_max)

  cameras:
    - agentview
    - eye_in_hand

  rotate_agentview_180: true

objects:
  - akita_black_bowl_1
  - akita_black_bowl_2
  - cookies_1
  - glazed_rim_porcelain_ramekin_1
  - plate_1
  - wooden_cabinet_1
  - flat_stove_1

so101:
  prompt_version: v1
  frame_step: 30 # SO101 videos are 30 FPS locally; 30 samples one frame per second
  frame_max: 10000
  cameras:
    - agent_view
    - wrist
  objects:
    - black_bowl
    - red_drawer
    - black_stove
    - cookie
    - white_plate
