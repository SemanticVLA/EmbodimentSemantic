# Reference catalogue of VLA policy checkpoints compatible with this eval wrapper.
# Pass the model ID via the MODELS environment variable when running:
#   MODELS=lerobot/pi0_libero_base python run_lerobot_eval_with_context.py

pi0:
  - id: lerobot/pi0_libero_finetuned
    description: pi0 fine-tuned on LIBERO spatial tasks

pi0.5:
  - id: lerobot/pi05_libero_finetuned
    description: pi0.5 fine-tuned on LIBERO spatial tasks

smolVLA:
  - id: HuggingFaceVLA/smolvla_libero
    description: smolVLA fine-tuned on LIBERO spatial tasks

openvla:
  - id: openvla/openvla-7b-finetuned-libero-spatial
    description: OpenVLA 7B fine-tuned on LIBERO Spatial (primary model for this experiment)

openvla-oft:
  - id: moojink/openvla-7b-oft-finetuned-libero-spatial-object-goal-10
    description: OpenVLA-OFT 7B fine-tuned on LIBERO Spatial with object-goal conditioning

octo:
  - id: akuramshin/octo-libero-100-finetuned
    description: Octo fine-tuned on LIBERO (100 demos)
  - id: cyrusneary/octo-finetuned-libero
    description: Octo fine-tuned on LIBERO

xvla:
  - id: lerobot/xvla-libero
    description: xVLA policy trained on LIBERO

molmo:
  - id: allenai/MolmoAct-7B-D-LIBERO-Spatial-0812
    description: MolmoAct 7B fine-tuned on LIBERO Spatial






