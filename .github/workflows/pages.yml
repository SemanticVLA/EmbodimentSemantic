name: Deploy demo to Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .nojekyll
      - vlm_benchmarking/demo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/vlm_benchmarking
          cp index.html .nojekyll _site/
          cp -R vlm_benchmarking/demo _site/vlm_benchmarking/demo
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
