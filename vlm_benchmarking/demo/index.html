<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIBERO Demo</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <header class="portal-header">
    <div class="brand">
      <strong>EmbodimentSemantic</strong>
      <span>Scene graph explorer</span>
    </div>
    <div class="dataset-tabs" role="tablist" aria-label="Dataset">
      <button id="liberoTab" type="button" role="tab" aria-selected="true">LIBERO</button>
      <button id="so101Tab" type="button" role="tab" aria-selected="false">SO101</button>
    </div>
    <div class="header-spacer">
      <span id="modeBadge" class="mode-badge" hidden></span>
    </div>
  </header>
  <main>
    <iframe id="demoFrame" title="LIBERO Demo" src="libero/"></iframe>
  </main>
  <script src="portal.js"></script>
</body>
</html>
